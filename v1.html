<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<title>Depth Lab · ATEAR</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#0d0c0a;--pn:#161410;--ln:#2a2723;--tx:#eefef5;--mu:#8c8987;--or:#f17714;--az:#1951b3}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--tx);font:12px/1.35 "PP Neue Montreal","Helvetica Neue",Arial,sans-serif}
#app{display:grid;grid-template-columns:1fr 340px;height:100vh}
#stage{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#000}
#stage canvas{max-width:calc(100% - 40px);max-height:calc(100% - 80px);image-rendering:auto;box-shadow:0 0 0 1px #222}
#top{position:absolute;top:0;left:0;right:0;display:flex;gap:6px;align-items:center;padding:10px 12px;z-index:2;flex-wrap:wrap}
#status{position:absolute;bottom:10px;left:12px;color:var(--mu);font-size:11px;letter-spacing:.02em}
#drop{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--mu);pointer-events:none;text-transform:uppercase;letter-spacing:.08em;font-size:13px}
#drop b{color:var(--tx);font-size:22px;letter-spacing:.02em}
#stage.over{outline:2px dashed var(--or);outline-offset:-10px}
#panel{background:var(--pn);border-left:1px solid var(--ln);overflow-y:auto;padding-bottom:40px}
#panel h1{font-size:13px;letter-spacing:.12em;text-transform:uppercase;padding:14px 14px 10px;display:flex;justify-content:space-between;align-items:center}
#panel h1 span{color:var(--or)}
details{border-top:1px solid var(--ln)}
summary{cursor:pointer;padding:10px 14px;text-transform:uppercase;letter-spacing:.1em;font-size:11px;list-style:none;display:flex;justify-content:space-between}
summary::after{content:"+";color:var(--mu)}
details[open] summary::after{content:"–"}
.sec{padding:2px 14px 12px}
.row{display:grid;grid-template-columns:96px 1fr 40px;gap:8px;align-items:center;margin:5px 0}
.row label{color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row output{text-align:right;font-variant-numeric:tabular-nums;color:var(--tx);font-size:11px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--ln)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;margin-top:-4px;background:var(--tx);border-radius:0}
input[type=range]:hover::-webkit-slider-thumb{background:var(--or)}
input[type=color]{width:100%;height:20px;border:1px solid var(--ln);background:none;padding:0;cursor:pointer}
select,button,.btn{background:#1f1c18;color:var(--tx);border:1px solid var(--ln);padding:6px 9px;font:inherit;cursor:pointer;text-transform:uppercase;letter-spacing:.06em;font-size:10.5px}
button:hover,.btn:hover{border-color:var(--or);color:var(--or)}
button.hot{background:var(--or);color:#0d0c0a;border-color:var(--or)}
button.hot:hover{color:#0d0c0a;filter:brightness(1.1)}
select{width:100%;text-transform:none;letter-spacing:0;font-size:11px}
.chk{display:flex;gap:8px;align-items:center;margin:6px 0;color:var(--mu);cursor:pointer}
.chk input{accent-color:var(--or)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:6px 0}
.note{color:var(--mu);font-size:10.5px;margin:6px 0}
#bar{position:absolute;left:0;bottom:0;height:3px;background:var(--or);width:0;transition:width .2s}
input[type=file]{display:none}
.colors{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0}
.colors div{display:flex;flex-direction:column;gap:3px;color:var(--mu);font-size:10px}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="top">
      <label class="btn">Abrir imagem / vídeo<input type="file" id="fMedia" accept="image/*,video/*"></label>
      <label class="btn">Depth map próprio<input type="file" id="fDepth" accept="image/*"></label>
      <button id="bPlay">Pausar</button>
      <button id="bRand">Aleatório (R)</button>
      <button id="bUndo">Voltar</button>
    </div>
    <canvas id="cv"></canvas>
    <div id="drop"><b>Solte uma imagem ou vídeo</b>em qualquer lugar da janela · ou cole com Cmd+V</div>
    <div id="status">pronto</div>
    <div id="bar"></div>
  </div>
  <div id="panel">
    <h1>Depth Motion <span>atear</span></h1>
    <div class="sec">
      <div class="row" style="grid-template-columns:96px 1fr"><label>Preset</label><select id="preset"></select></div>
      <div class="grid3"><button id="bSaveP">Salvar preset</button><label class="btn" style="text-align:center">Carregar<input type="file" id="fPreset" accept=".json"></label><button id="bReset">Zerar</button></div>
    </div>
    <div id="controls"></div>
    <details open><summary>Exportar</summary><div class="sec">
      <div class="row" style="grid-template-columns:96px 1fr"><label>Tamanho</label><select id="exSize">
        <option value="1">Original (1x)</option><option value="2" selected>2x</option><option value="3">3x</option><option value="4">4x</option>
        <option value="1080">1080 lado maior</option><option value="2160">2160 lado maior (4K)</option><option value="4096">4096 lado maior</option>
        <option value="1080x1350">1080×1350 feed 4:5</option><option value="1080x1920">1080×1920 story 9:16</option><option value="3840x2160">3840×2160 16:9</option></select></div>
      <div class="row" style="grid-template-columns:96px 1fr"><label>FPS vídeo</label><select id="exFps"><option>24</option><option selected>30</option><option>60</option></select></div>
      <div class="row" style="grid-template-columns:96px 1fr"><label>Qualidade</label><select id="exBr"><option value="12">Boa (12 Mbps)</option><option value="30" selected>Alta (30 Mbps)</option><option value="60">Máxima (60 Mbps)</option></select></div>
      <div class="row" style="grid-template-columns:96px 1fr"><label>Depth vídeo</label><select id="exEvery"><option value="1" selected>todo frame</option><option value="2">a cada 2 frames</option><option value="4">a cada 4 frames</option></select></div>
      <div class="grid3"><button class="hot" id="bPng">PNG</button><button class="hot" id="bMp4">Vídeo MP4</button><button id="bDepthPng">Só depth</button></div>
      <p class="note">Imagem parada vira vídeo em loop (duração = "Loop" em Motion). Vídeo exporta inteiro, com depth novo em cada frame.</p>
    </div></details>
  </div>
</div>

<script>

let lastVideoDepth=0;
function frame(now){
  requestAnimationFrame(frame); if(exporting) return;
  const dt=(now-last)/1000; last=now; if(playing) clock+=dt;
  if(isVideo&&media.readyState>=2){ uploadImg(media); if(!busy&&now-lastVideoDepth>60&&!media.paused){ lastVideoDepth=now; recomputeDepth(); } }
  const [W,H]=previewSize(); render(isVideo?media.currentTime:clock%P.loop,W,H);
}
requestAnimationFrame(frame);
$('#bPlay').onclick=()=>{playing=!playing; $('#bPlay').textContent=playing?'Pausar':'Tocar'; if(isVideo){playing?media.play():media.pause();}};
addEventListener('keydown',e=>{ if(e.target.tagName==='INPUT'&&e.target.type!=='range') return; if(e.target.tagName==='SELECT') return;
  if(e.key==='r'||e.key==='R') randomize(); if(e.key===' '){e.preventDefault();$('#bPlay').click();} if((e.metaKey||e.ctrlKey)&&e.key==='z'){e.preventDefault();$('#bUndo').click();} });

// ================= EXPORT =================
function outSize(){
  const v=$('#exSize').value; let W,H;
  if(v.includes('x')){[W,H]=v.split('x').map(Number);}
  else{ const n=Number(v); if(n<=4){W=srcW*n;H=srcH*n;} else {const s=n/Math.max(srcW,srcH);W=srcW*s;H=srcH*s;} }
  const maxT=gl.getParameter(gl.MAX_TEXTURE_SIZE); const s=Math.min(1,maxT/Math.max(W,H),8192/Math.max(W,H)); W=Math.round(W*s/2)*2;H=Math.round(H*s/2)*2; return [W,H];
}
function stamp(){const d=new Date();return d.toISOString().slice(0,19).replace(/[:T]/g,'-');}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000);}
// Para tamanhos fixos (feed/story), aplica "cover": ajusta srcW/srcH temporariamente não é necessário porque o shader usa uv 0-1; avisamos se a proporção muda.
$('#bPng').onclick=async()=>{
  exporting=true; const [W,H]=outSize(); status(`renderizando ${W}×${H}…`);
  render(isVideo?media.currentTime:clock%P.loop,W,H);
  cv.toBlob(b=>{download(b,`atear-depth_${W}x${H}_${stamp()}.png`); status(`PNG salvo ${W}×${H}`); exporting=false;},'image/png');
};
$('#bDepthPng').onclick=()=>{ const c=document.createElement('canvas'); c.width=depthW;c.height=depthH; const x=c.getContext('2d');
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  // relê o depth atual da memória da GPU
  const fb=gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER,fb); gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,texDepth,0);
  const px=new Uint8Array(depthW*depthH*4); gl.readPixels(0,0,depthW,depthH,gl.RGBA,gl.UNSIGNED_BYTE,px); gl.bindFramebuffer(gl.FRAMEBUFFER,null); gl.deleteFramebuffer(fb);
  const id=x.createImageData(depthW,depthH); for(let i=0;i<depthW*depthH;i++){id.data[i*4]=id.data[i*4+1]=id.data[i*4+2]=px[i*4];id.data[i*4+3]=255;}
  x.putImageData(id,0,0); c.toBlob(b=>download(b,`atear-depthmap_${depthW}x${depthH}_${stamp()}.png`));
};
$('#bMp4').onclick=async()=>{
  if(!('VideoEncoder' in window)){alert('Exportar MP4 precisa do Chrome atualizado.');return;}
  const [W,H]=outSize(); const fps=Number($('#exFps').value); const br=Number($('#exBr').value)*1e6; const every=Number($('#exEvery').value);
  const total = isVideo ? Math.floor(media.duration*fps) : Math.round(P.loop*fps);
  exporting=true; const wasPlaying=!media||!isVideo?false:!media.paused; if(isVideo) media.pause();
  const {Muxer,ArrayBufferTarget}=window.Mp4Muxer;
  const muxer=new Muxer({target:new ArrayBufferTarget(),video:{codec:'avc',width:W,height:H},fastStart:'in-memory'});
  const enc=new VideoEncoder({output:(c,m)=>muxer.addVideoChunk(c,m),error:e=>{console.error(e);status('erro encoder: '+e.message);}});
  const pix=W*H; const level = pix>2228224?'640034':(pix>921600?'640028':'64001f');
  let cfg={codec:'avc1.'+level,width:W,height:H,bitrate:br,framerate:fps,avc:{format:'avc'}};
  const sup=await VideoEncoder.isConfigSupported(cfg); if(!sup.supported){cfg.codec='avc1.640033';}
  enc.configure(cfg); prevDepth=null;
  try{
    for(let i=0;i<total;i++){
      const t=i/fps;
      if(isVideo){ media.currentTime=Math.min(t,media.duration-0.001); await new Promise(r=>media.addEventListener('seeked',r,{once:true}));
        uploadImg(media); if(i%every===0){ let d=await computeDepth(); if(d){d=stabilize(d);uploadDepth(d.u8,d.w,d.h);} } }
      render(t,W,H);
      const vf=new VideoFrame(cv,{timestamp:Math.round(t*1e6),duration:Math.round(1e6/fps)});
      enc.encode(vf,{keyFrame:i%(fps*2)===0}); vf.close();
      if(enc.encodeQueueSize>8) await new Promise(r=>setTimeout(r,5));
      bar(i/total); status(`exportando vídeo ${W}×${H} · frame ${i+1}/${total}`);
      if(i%10===0) await new Promise(r=>setTimeout(r,0));
    }
    await enc.flush(); muxer.finalize();
    download(new Blob([muxer.target.buffer],{type:'video/mp4'}),`atear-depth_${W}x${H}_${fps}fps_${stamp()}.mp4`);
    status(`vídeo salvo ${W}×${H} · ${total} frames`);
  }catch(e){console.error(e);status('erro ao exportar: '+e.message);}
  enc.close(); bar(0); exporting=false; if(isVideo&&wasPlaying) media.play();
};
window.__atear={P:()=>P,set:o=>{Object.assign(P,o);syncUI();},render,loadFile,randomize};
status('abra uma imagem ou vídeo (ou arraste pra cá)');
</script>
